repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: local
    hooks:
      - id: sqlfluff-lint
        name: sqlfluff lint (dbt container)
        entry: bash -c 'docker compose exec -T dbt sqlfluff lint "${@#dbt/}"' --
        language: system
        files: ^dbt/(models|tests|macros)/.*\.sql$
        require_serial: true
