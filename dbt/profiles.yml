my_project:
  target: dev
  outputs:
    dev:
      type: clickhouse
      driver: http                 
      host: "{{ env_var('CH_HOST', 'localhost') }}"
      port: 8123
      user: "{{ env_var('CH_USER') }}"
      password: "{{ env_var('CH_PASSWORD') }}"
      schema: analytics            # ClickHouse database dbt writes into
      secure: false                
      threads: 4
      connect_timeout: 10