x-superset-common: &superset-common
  build: ./superset
  image: superset-clickhouse:6.1.0         
  environment: &superset-env
    SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
    SUPERSET_CONFIG_PATH: /app/superset_config.py
    SUPERSET_DB_USER: ${SUPERSET_DB_USER}
    SUPERSET_DB_PASSWORD: ${SUPERSET_DB_PASSWORD}
    SUPERSET_DB_NAME: ${SUPERSET_DB_NAME}
  volumes:
    - ./superset/superset_config.py:/app/superset_config.py:ro
  depends_on:
    superset-db:
      condition: service_healthy


services:
  kafka:
    image: apache/kafka:4.0.0
    ports:
      - "9092:9092"              
    environment:
      KAFKA_NODE_ID: 1                              
      KAFKA_PROCESS_ROLES: broker,controller         
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093   
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER    

      
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0     

    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-init:
    image: apache/kafka:4.0.0                
    depends_on:
      kafka:
        condition: service_healthy         
    entrypoint: ["/bin/sh", "-c"]            
    command:
      - |
        set -e
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 \
          --create --if-not-exists \
          --topic csv_rows \
          --partitions 1 \
          --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 \
          --describe --topic csv_rows

  producer:
    build: ./producer                  
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092   
      KAFKA_TOPIC: csv_rows
      CSV_PATH: /app/data/train.csv          
    volumes:
      - ${TRAIN_CSV:-./data/train.csv}:/app/data/train.csv:ro
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    ports:
      - "127.0.0.1:8123:8123"     
      - "127.0.0.1:9000:9000"     
    environment:
      CLICKHOUSE_USER: ${CH_USER}
      CLICKHOUSE_PASSWORD: ${CH_PASSWORD}
    volumes:
      - ./clickhouse/init:/docker-entrypoint-initdb.d   
      - clickhouse_data:/var/lib/clickhouse             
    ulimits:
      nofile: { soft: 262144, hard: 262144 }           
    depends_on:
      kafka-init:
        condition: service_completed_successfully     

  dbt:
    build: ./dbt
    volumes:
      - ./dbt:/usr/app/dbt          
    environment:
      CH_HOST: clickhouse            
      CH_USER: ${CH_USER}
      CH_PASSWORD: ${CH_PASSWORD}
    depends_on:
      - clickhouse
    command: sleep infinity  

  superset-db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${SUPERSET_DB_USER}
      POSTGRES_PASSWORD: ${SUPERSET_DB_PASSWORD}
      POSTGRES_DB: ${SUPERSET_DB_NAME}
    volumes:
      - superset_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SUPERSET_DB_USER} -d ${SUPERSET_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  superset-init:
    <<: *superset-common
    environment:
      <<: *superset-env
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
      CH_USER: ${CH_USER}
      CH_PASSWORD: ${CH_PASSWORD}
    volumes:
      - ./superset/superset_config.py:/app/superset_config.py:ro
      - ./superset/init_clickhouse_connection.py:/app/init_clickhouse_connection.py:ro
    command: >
      bash -c "superset db upgrade &&
      (superset fab create-admin --username admin --firstname Admin --lastname User --email admin@example.com --password \"$$SUPERSET_ADMIN_PASSWORD\" || true) &&
      superset init &&
      python /app/init_clickhouse_connection.py"

  superset:
    <<: *superset-common
    ports:
      - "8088:8088"
    depends_on:
      superset-db:
        condition: service_healthy
      superset-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_started


volumes:
  clickhouse_data:
  superset_db_data: